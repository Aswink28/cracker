<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice" role="presentation">
  <title>Festive band backdrop</title>
  <defs>
    <linearGradient id="cbGround" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#571111"/>
      <stop offset="0.5" stop-color="#8e1b1b"/>
      <stop offset="1" stop-color="#571111"/>
    </linearGradient>
    <radialGradient id="cbGlow" cx="0.68" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ffa24a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffa24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cbEmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>

    <path id="cbPetal" d="M0 0 C 9 -15, 24 -15, 33 0 C 24 15, 9 15, 0 0 Z"/>
    <g id="cbRosette" fill="none" stroke="#e9b85c" stroke-width="1.3">
      <use href="#cbPetal" transform="rotate(0)"/>
      <use href="#cbPetal" transform="rotate(30)"/>
      <use href="#cbPetal" transform="rotate(60)"/>
      <use href="#cbPetal" transform="rotate(90)"/>
      <use href="#cbPetal" transform="rotate(120)"/>
      <use href="#cbPetal" transform="rotate(150)"/>
      <use href="#cbPetal" transform="rotate(180)"/>
      <use href="#cbPetal" transform="rotate(210)"/>
      <use href="#cbPetal" transform="rotate(240)"/>
      <use href="#cbPetal" transform="rotate(270)"/>
      <use href="#cbPetal" transform="rotate(300)"/>
      <use href="#cbPetal" transform="rotate(330)"/>
      <circle r="7"/>
      <circle r="15"/>
    </g>

    <g id="cbBurst">
      <circle r="3.5" fill="url(#cbEmber)"/>
      <path fill="none" stroke="#ffd98a" stroke-width="1.4" stroke-linecap="round" opacity="0.85"
        d="M10 0 L38 0 M8.66 5 L32.9 19 M5 8.66 L19 32.9 M0 10 L0 38
           M-5 8.66 L-19 32.9 M-8.66 5 L-32.9 19 M-10 0 L-38 0
           M-8.66 -5 L-32.9 -19 M-5 -8.66 L-19 -32.9 M0 -10 L0 -38
           M5 -8.66 L19 -32.9 M8.66 -5 L32.9 -19"/>
    </g>
  </defs>

  <rect width="1600" height="420" fill="url(#cbGround)"/>
  <rect width="1600" height="420" fill="url(#cbGlow)"/>

  <g opacity="0.26">
    <use href="#cbRosette" transform="translate(80,70) scale(1.4)"/>
    <use href="#cbRosette" transform="translate(60,330) scale(1.0)"/>
    <use href="#cbRosette" transform="translate(1530,90) scale(1.3)"/>
    <use href="#cbRosette" transform="translate(1550,340) scale(1.0)"/>
  </g>

  <g opacity="0.8">
    <use href="#cbBurst" transform="translate(1150,90) scale(1.1)"/>
    <use href="#cbBurst" transform="translate(1330,300) scale(0.75)"/>
  </g>

  <g fill="#ffcf8a">
    <circle cx="420" cy="80" r="2.6" opacity="0.4"/>
    <circle cx="700" cy="330" r="2.2" opacity="0.32"/>
    <circle cx="960" cy="140" r="2.8" opacity="0.38"/>
  </g>
</svg>
